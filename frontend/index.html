<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Sistema de gestión financiera personal"
    />
    <title>Gestión Financiera</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <script>
      // Aplica color y modo guardados antes del primer render (evita flash).
      ;(function () {
        var root = document.documentElement

        try {
          var storedColor = JSON.parse(
            localStorage.getItem('finanzas.theme-color') || '{}',
          )
          var color = storedColor && storedColor.state && storedColor.state.color
          root.setAttribute('data-theme-color', color || 'blue')
        } catch (error) {
          root.setAttribute('data-theme-color', 'blue')
        }

        try {
          var storedMode = JSON.parse(
            localStorage.getItem('finanzas.theme-mode') || '{}',
          )
          var mode = storedMode && storedMode.state && storedMode.state.mode
          if (mode === 'dark') {
            root.classList.add('dark')
          }
        } catch (error) {
          // Sin modo guardado se usa el tema claro por defecto.
        }
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
